<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWF Protect Earth</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /*  */
            background: url("https://static.wwfchina.org/storage/images/轮播图模板1.jpg") no-repeat center center / cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 40px;
            border-radius: 10px;
            text-align: center;
        }

        .search-box h2 {
            margin-bottom: 20px;
        }

        .search-box input[type="text"] {
            width: 320px;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        .search-box button {
            margin-top: 15px;
            padding: 10px 40px;
            font-size: 18px;
            border: none;
            background: #0078d7;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #005bb5;
        }
    </style>
</head>
<body>
    <div class="search-box">
        <h2>Bing</h2>
        <form action="https://www.bing.com/search" method="get" target="_blank">
            <input
                type="text"
                name="q"
                placeholder=""
                required
            >
            <br>
            <button type="submit">GO</button>
        </form>
    </div>
</body>
</html>
